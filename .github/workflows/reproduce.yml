name: Reproduce R analysis
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install analysis dependencies
        run: Rscript -e 'install.packages(c("ggplot2", "dplyr", "zoo"), repos="https://cloud.r-project.org")'
      - name: Run unchanged analytical methods
        run: Rscript forecast_model.R
      - name: Verify expected outputs
        run: Rscript -e 'stopifnot(all(file.exists(file.path("outputs", c("log_trend.png", "decomposition.png", "analysis.csv", "seasonality.csv", "sessionInfo.txt")))))'
